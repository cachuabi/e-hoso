spring.application.name=ehoso-backend
server.port=8080
server.forward-headers-strategy=framework

# NFR-10: store and compute every timestamp in Asia/Ho_Chi_Minh.
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Database (docker-compose.yml service "db").
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ehoso}
spring.datasource.username=${DB_USER:ehoso}
spring.datasource.password=${DB_PASSWORD:ehoso-dev-only}
spring.flyway.locations=classpath:db/migration

# FR-08: one file at most 10 MB; multipart overhead allowed for.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# SMTP (Mailpit in the demo). FR-14.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
ehoso.mail.enabled=${MAIL_ENABLED:true}
ehoso.mail.from=${MAIL_FROM:no-reply@ehoso.local}
ehoso.notification.delay-ms=5000

# Security. NFR-03.
ehoso.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret}
ehoso.jwt.ttl-minutes=30
ehoso.refresh.ttl-days=7
ehoso.cookie.secure=${COOKIE_SECURE:true}
ehoso.public-url=${PUBLIC_URL:https://localhost}

# File storage (Garage). ADR-001, SDD section 11.
ehoso.storage.endpoint-internal=${S3_ENDPOINT_INTERNAL:http://localhost:3900}
ehoso.storage.endpoint-public=${S3_ENDPOINT_PUBLIC:http://localhost:3900}
ehoso.storage.region=${S3_REGION:garage}
ehoso.storage.bucket=${S3_BUCKET:ehoso}
ehoso.storage.access-key=${S3_ACCESS_KEY:GK0000000000000000000000dev}
ehoso.storage.secret-key=${S3_SECRET_KEY:dev-only-secret-key-0000000000000000}

# Business parameters. SRS section 6.
ehoso.deadline.cutoff-hour=15
ehoso.deadline.end-hour=17

# Demo accounts, fake data only (NFR-04).
ehoso.demo.enabled=${DEMO_ENABLED:false}
ehoso.demo.password=${DEMO_PASSWORD:Demo12345}

# REST API lives under /api/v1 (SRS section 9); OpenAPI 3 description at /v3/api-docs.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info
