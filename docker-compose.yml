# NFR-08: the whole system starts with `docker compose up`. Only fake data (NFR-04).
# Secrets below are development defaults; override them through the environment.

services:
  proxy:
    build:
      context: .
      dockerfile: infra/proxy/Dockerfile
    environment:
      SITE_HOST: ${SITE_HOST:-localhost}
    ports:
      - "443:443"
      - "9443:9443"
    volumes:
      - caddy-data:/data
    mem_limit: 64m
    depends_on:
      - backend

  backend:
    build: src/backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/ehoso
      DB_USER: ehoso
      DB_PASSWORD: ehoso-dev-only
      SMTP_HOST: mail
      SMTP_PORT: 1025
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret}
      PUBLIC_URL: https://${SITE_HOST:-localhost}
      S3_ENDPOINT_INTERNAL: http://storage:3900
      S3_ENDPOINT_PUBLIC: https://${SITE_HOST:-localhost}:9443
      S3_REGION: garage
      S3_BUCKET: ehoso
      S3_ACCESS_KEY: &s3-access GK0123456789abcdef01234567
      S3_SECRET_KEY: &s3-secret 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DEMO_ENABLED: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo12345}
    mem_limit: 1g
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
      mail:
        condition: service_started

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ehoso
      POSTGRES_USER: ehoso
      POSTGRES_PASSWORD: ehoso-dev-only
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ehoso -d ehoso"]
      interval: 5s
      retries: 10

  # ADR-001: single-node Garage creates its key and bucket from these variables.
  storage:
    image: dxflrs/garage:v2.5.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff}
      GARAGE_DEFAULT_ACCESS_KEY: *s3-access
      GARAGE_DEFAULT_SECRET_KEY: *s3-secret
      GARAGE_DEFAULT_BUCKET: ehoso
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      retries: 20

  # Test SMTP server (assumption A5): catches every email, web UI on http://localhost:8025
  mail:
    image: axllent/mailpit:v1.32
    ports:
      - "1025:1025"
      - "8025:8025"
    mem_limit: 64m

volumes:
  db-data:
  garage-meta:
  garage-data:
  caddy-data:
