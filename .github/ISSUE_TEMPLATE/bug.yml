name: Báo lỗi
description: Lỗi tìm thấy khi kiểm thử. Dùng cho chỉ số "Lỗi theo mức độ nghiêm trọng".
title: "[bug] "
labels: [bug]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Mức độ nghiêm trọng
      options:
        - Critical
        - Major
        - Minor
    validations:
      required: true
  - type: input
    id: requirements
    attributes:
      label: Yêu cầu bị ảnh hưởng
      description: Ví dụ FR-17, BR-03.
  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi và kết quả thực tế
    validations:
      required: true
