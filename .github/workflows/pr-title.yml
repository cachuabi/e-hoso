# Pull requests are squash-merged, so the PR title becomes the commit on main.
# It must follow Conventional Commits: <type>(optional scope): <description>
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check Conventional Commits format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "OK: $TITLE"
          else
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(dossier): nộp hồ sơ (FR-09)'. Got: $TITLE"
            exit 1
          fi
