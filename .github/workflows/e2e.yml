# Runs the real system on Docker Compose: D17 K1–K7, acceptance flows, performance, security scan.
name: E2E

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm] # K7: x86 and arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: K1 – start from a clean clone
        run: |
          docker compose up -d --build
          for i in $(seq 1 90); do
            curl -skf https://localhost/api/v1/procedures >/dev/null && break
            sleep 5
          done
          curl -skf https://localhost/api/v1/procedures | head -c 200
      - name: K2 – idle memory
        run: docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' | tee k2-idle.txt
      - name: Acceptance flows, K3, K4, K5, screenshots
        timeout-minutes: 15
        run: |
          docker run --rm --network host -v "$PWD/tests:/work" -w /work \
            mcr.microsoft.com/playwright:v1.56.1-noble \
            sh -c "npm install --no-audit --no-fund && npx playwright test"
      - name: K2 – memory after the flows
        run: docker stats --no-stream --format '{{.Name}} {{.MemUsage}}' | tee k2-after.txt
      - name: K6 – restart keeps data (NFR-05), reset clears it
        run: |
          count() { docker compose exec -T db psql -U ehoso -d ehoso -Atc 'select count(*) from dossier'; }
          BEFORE=$(count); echo "before=$BEFORE"
          docker compose restart
          for i in $(seq 1 60); do curl -skf https://localhost/api/v1/procedures >/dev/null && break; sleep 5; done
          AFTER=$(count); echo "after=$AFTER"
          test "$BEFORE" = "$AFTER" && test "$AFTER" -gt 0
          echo "{\"before\":$BEFORE,\"after\":$AFTER}" > k6-restart.json
      - name: Performance (CK-P01)
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          docker run --rm --network host -v "$PWD/tests:/t" grafana/k6:1.3.0 run \
            --summary-export /t/perf-summary.json /t/perf.js | tee perf.txt
      - name: Security baseline scan (D22)
        if: matrix.runner == 'ubuntu-24.04'
        continue-on-error: true
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t https://localhost -r zap.html -J zap.json -I
      - name: Reset clears the data (K6)
        run: |
          docker compose down -v
          docker compose up -d db
          for i in $(seq 1 30); do docker compose exec -T db pg_isready -U ehoso && break; sleep 2; done
          docker compose exec -T db psql -U ehoso -d ehoso -Atc "select count(*) from information_schema.tables where table_schema='public'" | tee k6-reset.txt
          test "$(cat k6-reset.txt)" = "0"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-${{ matrix.runner }}
          path: |
            k2-*.txt
            k6-*
            perf.txt
            zap/
            tests/perf-summary.json
            tests/k5-upload-ms.txt
            tests/screenshots/
            tests/report/
            tests/test-results/
          if-no-files-found: ignore
