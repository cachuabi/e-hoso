name: Setup project
description: Java 21 (Maven), Node.js and Python for the e-HoSo monorepo, then dependencies.

runs:
  using: composite
  steps:
    - name: Setup Java 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "21"
        cache: maven
        cache-dependency-path: src/backend/pom.xml

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm
        cache-dependency-path: src/frontend/package-lock.json

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      shell: bash
      run: make deps
